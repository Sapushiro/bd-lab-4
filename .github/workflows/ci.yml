name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: sapushiro/banknote-api-lab3

jobs:
  build-test-push:
    name: Build, test and push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install DVC
        run: |
          python -m pip install --upgrade pip
          python -m pip install "dvc==3.67.1"

      - name: Configure DagsHub authentication
        run: |
          dvc remote modify --local origin auth basic
          dvc remote modify --local origin user "${{ secrets.DAGSHUB_USERNAME }}"
          dvc remote modify --local origin password "${{ secrets.DAGSHUB_TOKEN }}"

      - name: Pull data and model with DVC
        run: dvc pull -r origin

      - name: Build Docker image
        run: |
          docker build \
            --tag "${IMAGE_NAME}:latest" \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      - name: Run unit tests inside container
        run: |
          docker run --rm \
            "${IMAGE_NAME}:${GITHUB_SHA}" \
            python -m unittest discover -s src/unit_tests -v

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image to DockerHub
        run: |
          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"